  function tick() {
    var sun = document.getElementById('dialSun'), time = document.getElementById('dialTime');
    if (!sun) return;
    var p = Math.min(1, Math.max(0, scrollY / Math.max(1, de.scrollHeight - innerHeight)));
    var f = p * (sky.length - 1), i = Math.min(sky.length - 2, Math.floor(f));
    de.style.setProperty('--navbg', mix(sky[i], sky[i + 1], f - i));
    de.style.setProperty('--navfg', p > .5 ? '#fbf1de' : '#1a1430');
    sun.style.setProperty('--p', p.toFixed(3));
    sun.style.background = p > .55 ? '#e0643f' : '#f6b443';
    var m = Math.round(930 + p * 210);
    time.textContent = String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  }
  addEventListener('scroll', tick, { passive: true });
  addEventListener('resize', function () { tick(); sizeStars(); });

  // ---- Stars
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, stars = [], sw = 0, sh = 0, raf = 0, cv = null, ctx = null;
  function sizeStars() {
    if (!cv) return;
    var r = cv.getBoundingClientRect(), d = devicePixelRatio || 1;
    sw = r.width; sh = r.height; cv.width = sw * d; cv.height = sh * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    stars = Array.from({ length: Math.round(sw * sh / 7000) }, function () { return { x: Math.random() * sw, y: Math.random() * sh, r: Math.random() * 1.5 + .4, p: Math.random() * 6.28, s: Math.random() * .8 + .3 }; });
  }
  function draw(t) {
    ctx.clearRect(0, 0, sw, sh);
    stars.forEach(function (s) {
      ctx.globalAlpha = reduce ? .7 : .3 + .6 * (Math.sin(t / 1000 * s.s + s.p) * .5 + .5);
      ctx.fillStyle = '#f0c97c'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
    });
    if (!reduce) raf = requestAnimationFrame(draw);
  }
  function initStars() { cancelAnimationFrame(raf); cv = document.getElementById('stars'); ctx = cv.getContext('2d'); sizeStars(); raf = requestAnimationFrame(draw); }

  // ---- Clicks
  root.addEventListener('click', function (e) {
    var t = e.target;
    if (t.closest('#copyBtn')) {
      var code = document.getElementById('mailAddr'), btn = t.closest('#copyBtn');
      var sel = function () { var r = document.createRange(); r.selectNodeContents(code); var s = getSelection(); s.removeAllRanges(); s.addRange(r); };
      try { navigator.clipboard.writeText(code.textContent).then(function () { btn.textContent = 'คัดลอกแล้ว'; setTimeout(function () { btn.textContent = 'คัดลอก'; }, 1600); }, sel); } catch (err) { sel(); }
      return;
    }
    var tab = t.closest('.shop-tab');
    if (tab) {
      e.preventDefault();
      shopShow = tab.dataset.cat;
      root.querySelector('.cards').setAttribute('data-show', shopShow);
      root.querySelectorAll('.shop-tab').forEach(function (x) { x.setAttribute('aria-pressed', String(x === tab)); });
      return;
    }
    if (!editing) return;
    var b = t.closest('[data-act],[data-add],[data-link],[data-img],[data-imgdel]');
    if (b) {
      e.preventDefault(); e.stopPropagation();
      if (b.dataset.link) return openLink(b.dataset.link);
      if (b.dataset.img) return pickImage(b.dataset.img);
      if (b.dataset.imgdel) { setp(b.dataset.imgdel, ''); changed(true); return; }
      if (b.dataset.add) { get(b.dataset.add).push(clone(NEW[b.dataset.add])); changed(true); return; }
      var ks = b.dataset.p.split('.'), idx = +ks.pop(), list = get(ks.join('.'));
      if (b.dataset.act === 'del') list.splice(idx, 1);
      if (b.dataset.act === 'up') list.splice(idx - 1, 0, list.splice(idx, 1)[0]);
      if (b.dataset.act === 'down') list.splice(idx + 1, 0, list.splice(idx, 1)[0]);
      if (b.dataset.act === 'cat') { var ci = CATS.indexOf(catOf(list[idx].cat)); list[idx].cat = CATS[(ci + 1) % CATS.length].k; }
      if (b.dataset.act === 'art') list[idx].art = ((list[idx].art || 0) + 1) % ART.length;
      changed(true); return;
    }
    if (t.closest('a, summary')) e.preventDefault();
  }, true);

  root.addEventListener('input', function (e) {
    var k = e.target.closest && e.target.closest('[data-k]');
    if (!k) return;
    setp(k.dataset.k, k.innerText.replace(/\n+$/, ''));
    changed(false);
  });
  root.addEventListener('paste', function (e) {
    if (!editing || !e.target.closest('[data-k]')) return;
    e.preventDefault();
    document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain'));
  });
  root.addEventListener('keydown', function (e) {
    if (!editing) return;
    var k = e.target.closest && e.target.closest('[data-k]');
    if (k && (e.key === ' ' || e.key === 'Enter') && k.closest('summary')) e.stopPropagation();
  });

  // ---- Edit UI (outside #root, never saved)
  var toggle, bar, msg, saveBtn;
  function changed(repaint) { dirty = true; if (repaint) paint(); status(); }
  function status(text) {
    if (!bar) return;
    msg.innerHTML = text || (dirty ? '<b>มีการแก้ไขที่ยังไม่ได้บันทึก</b> · กดบันทึกเพื่อให้ทุกคนเห็น' : '<b>โหมดแก้ไข</b> · คลิกข้อความที่มีเส้นประเพื่อแก้ ใช้ปุ่มบนการ์ดเพื่อเพิ่ม ลบ หรือเรียงลำดับ');
    saveBtn.disabled = !dirty || busy;
  }
  function enter() { editing = true; shopShow = 'all'; toggle.hidden = true; bar.hidden = false; paint(); status(); }
  function leave() { editing = false; dirty = false; state = clone(saved); toggle.hidden = false; bar.hidden = true; paint(); }
  function buildUI() {
    toggle = document.createElement('button');
    toggle.id = 'ed-toggle'; toggle.type = 'button'; toggle.textContent = '✎ แก้ไขเว็บ';
    toggle.addEventListener('click', enter);
    bar = document.createElement('div'); bar.id = 'ed-bar'; bar.hidden = true;
    bar.innerHTML = '<span class="msg"></span><button type="button" id="ed-cancel">ยกเลิก</button><button type="button" class="primary" id="ed-save">บันทึกและเผยแพร่</button>';
    document.body.appendChild(toggle); document.body.appendChild(bar);
    msg = bar.querySelector('.msg'); saveBtn = bar.querySelector('#ed-save');
    bar.querySelector('#ed-cancel').addEventListener('click', leave);
    saveBtn.addEventListener('click', save);
    addEventListener('beforeunload', function (e) { if (dirty && !busy) { e.preventDefault(); e.returnValue = ''; } });
  }
  function openLink(p) {
    var pop = document.createElement('div');
    pop.id = 'ed-pop';
    pop.innerHTML = '<div class="box" role="dialog" aria-modal="true" aria-labelledby="ed-pop-h"><h4 id="ed-pop-h">แก้ลิงก์</h4><label for="ed-url">วางลิงก์ที่ต้องการ (ขึ้นต้นด้วย https://)</label><input id="ed-url" type="url" inputmode="url"><div class="row"><button type="button" data-x>ยกเลิก</button><button type="button" class="primary" data-ok>ใช้ลิงก์นี้</button></div></div>';
    document.body.appendChild(pop);
    var inp = pop.querySelector('input'); inp.value = get(p) || ''; inp.focus(); inp.select();
    function close() { pop.remove(); }
    function ok() { var v = inp.value.trim(); if (v && !/^(https?:|#)/i.test(v)) v = 'https://' + v; setp(p, v); close(); changed(true); }
    pop.querySelector('[data-x]').onclick = close;
    pop.querySelector('[data-ok]').onclick = ok;
    pop.addEventListener('click', function (e) { if (e.target === pop) close(); });
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') ok(); if (e.key === 'Escape') close(); });
  }
  function shrink(file, max) {
    var ok = /^image\/(jpeg|png|webp|gif)$/.test(file.type);
    if (ok && file.size < 3 * 1024 * 1024) return Promise.resolve(file);
    return new Promise(function (res, rej) {
      var u = URL.createObjectURL(file), im = new Image();
      im.onload = function () {
        var k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
        var c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
        c.toBlob(function (b) { b ? res(b) : rej({ code: 'unsupported_type' }); }, 'image/jpeg', .86);
      };
      im.onerror = function () { URL.revokeObjectURL(u); rej({ code: 'unsupported_type' }); };
      im.src = u;
    });
  }
  function pickImage(p) {
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.style.position = 'fixed'; inp.style.left = '-999px'; document.body.appendChild(inp);
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0]; inp.remove(); if (!f) return;
      var veil = document.createElement('div'); veil.className = 'ed-busy'; veil.textContent = 'กำลังอัปโหลดรูป…'; document.body.appendChild(veil);
      shrink(f, p === 'logoImg' ? 900 : 1800).then(function (blob) { return assets.upload(blob); }).then(function (r) {
        veil.remove(); setp(p, r.id); changed(true);
      }, function (err) {
        veil.remove(); var c = err && err.code;
        status(c === 'too_large' ? '<b>รูปใหญ่เกินไป</b> · เลือกรูปที่เล็กกว่า 20 MB' :
          c === 'unsupported_type' ? '<b>ไฟล์นี้ใช้เป็นรูปไม่ได้</b> · ลองเลือกรูป JPG หรือ PNG' :
          c === 'quota_or_state' ? '<b>พื้นที่เก็บรูปเต็มแล้ว</b> · ลบรูปที่ไม่ใช้ออกก่อน' :
          c === 'rate_limited' ? '<b>อัปโหลดถี่เกินไป</b> · รอสักครู่แล้วลองใหม่' :
          '<b>อัปโหลดรูปไม่สำเร็จ</b> · ตรวจการเชื่อมต่อแล้วลองใหม่');
      });
    });
    inp.click();
  }
  function buildDoc() {
    var was = editing, show = shopShow; editing = false; shopShow = 'all'; var body = render(); editing = was; shopShow = show;
    var css = document.getElementById('site-style').textContent;
    var json = JSON.stringify(state).replace(/</g, '\\u003c');
    var app = document.getElementById('app').textContent;
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' +
      HEAD_EXTRA + '<style id="site-style">' + css + '</style><div id="root">' + body + '</div><script type="application/json" id="site-data">' + json + '<\/script><script id="app">' + app + '<\/script></body></html>';
  }
  function save() {
    if (!art || busy) return;
    var active = document.activeElement; if (active && active.blur) active.blur();
    busy = true; status('<b>กำลังบันทึก…</b>');
    art.publish(buildDoc()).then(function () {
      dirty = false; status('<b>บันทึกแล้ว</b> · หน้าเว็บกำลังโหลดเวอร์ชันใหม่');
    }, function (err) {
      busy = false;
      var c = err && err.code;
      if (c === 'conflict') { dirty = false; status('<b>มีเวอร์ชันใหม่กว่าถูกบันทึกไปก่อน</b> · หน้าเว็บกำลังโหลดเวอร์ชันล่าสุด กรุณาแก้อีกครั้ง'); return; }
      if (c === 'not_writer' || c === 'not_granted' || c === 'not_declared' || c === 'consent_required' || c === 'capability_disabled' || c === 'capability_removed') { status('<b>บัญชีนี้แก้ไขเว็บไม่ได้</b> · ต้องเป็นเจ้าของหรือผู้มีสิทธิ์แก้ไข'); saveBtn.disabled = true; return; }
      if (c === 'too_large') { status('<b>หน้าเว็บใหญ่เกินไป</b> · ลองลบเนื้อหาบางส่วนแล้วบันทึกใหม่'); return; }
      if (c === 'rate_limited') { status('<b>บันทึกถี่เกินไป</b> · รอสักครู่แล้วกดบันทึกอีกครั้ง'); return; }
      status('<b>บันทึกไม่สำเร็จ</b> · ตรวจการเชื่อมต่อแล้วกดบันทึกอีกครั้ง');
    });
  }

  paint();

  if (window.claude && window.claude.use) {
    Promise.all([window.claude.use('artifact'), window.claude.use('user'), window.claude.use('assets')]).then(function (r) {
      art = r[0]; var user = r[1]; assets = r[2];
      if (!art || !user) return;
      return user.canEdit().then(function (ok) { if (ok) buildUI(); });
    }).catch(function () {});
  }
})();
</script>
