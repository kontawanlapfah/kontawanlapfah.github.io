<body>

<script>
// Narration: verbatim from the series document, EP5 (Hook / script / cliffhanger).
// One caption per line: align.py reads this list.
// "He" is never shown from the front: from behind, from above, or as a silhouette only (document, visual guide 3 and 5).
const CAPS = [
  [0, 5.6, '', 'ผมเห็นทองคำลอยออกมาจากใต้ซากตึก…<br>แล้วบินตามชายคนหนึ่งไป<br>เหมือนฝูงผึ้งตามนางพญา'],
  [9.6, 13.5, '', 'ผมบอกฮาริสว่า<br>ผมจะไม่ไปดูเขา แม้แต่ก้าวเดียว'],
  [13.5, 19.5, 'q', '<span class="n">ฮาริสเงียบไปนาน แล้ววางกล่องยาลงบนโต๊ะ</span><br>“งั้นก็เอาไว้ให้ฮาวาเถอะ…<br>ไม่ต้องแลกอะไรทั้งนั้น”'],
  [19.5, 24, '', 'เป็นครั้งแรกในรอบหลายเดือน<br>ที่ผมเห็นเพื่อนคนเดิมของผมในแววตาเขา'],
  [24, 28.5, '', 'ซัลมาป้อนยาให้ลูก ไข้ค่อย ๆ ลดลง<br>อัลฮัมดุลิลลาฮ์'],
  [28.5, 32.5, '', 'แต่เช้าวันต่อมา<br>ทั้งเมืองสั่นสะเทือนด้วยเสียงฝูงชน'],
  [32.5, 37, '', 'ผมขึ้นไปบนหลังคา และเห็นขบวนคนนับหมื่น<br>ไหลเข้ามาจากถนนสายตะวันออก'],
  [37, 41, '', 'ตรงกลางคือชายคนหนึ่ง<br>ที่ทุกคนเงยหน้ามอง'],
  [41, 45, '', 'ขบวนหยุดหน้าซากตึกที่ถล่มไปนานแล้ว<br>เขาพูดอะไรบางอย่าง'],
  [45, 47.5, '', 'แล้วสิ่งที่ผมไม่มีวันลืมก็เกิดขึ้น…'],
  [47.5, 52.5, '', 'ทองคำ เงิน และสมบัติที่ฝังอยู่ใต้ดิน<br>ลอยขึ้นมาแล้วเคลื่อนตามเขาไปเป็นกลุ่มก้อน'],
  [52.5, 56.5, '', 'คนข้างล่างกรีดร้องด้วยความตื่นเต้น<br>บางคนก้มลงสุญูดให้เขา'],
  [56.5, 62, 'q', '<span class="n">มือผมเย็นเฉียบ แต่ผมพูดกับตัวเองซ้ำ ๆ ว่า</span><br>ทั้งหมดนี้ไม่มีค่าอะไรเลย<br>ในสายตาของอัลลอฮ์'],
  [62, 66.5, '', 'ขบวนเลี้ยวเข้าซอยบ้านผม<br>ชายคนนั้นหยุดเดินตรงใต้หลังคาที่ผมยืนอยู่'],
  [66.5, 69.5, '', 'แล้วเขาก็ค่อย ๆ เงยหน้าขึ้นมา'],
  [69.5, 73, 'big', 'ผมจะได้เห็นอะไรบนใบหน้านั้น?'],
  [73, 77.5, 'big', 'และเขารู้หรือไม่ว่าบ้านหลังนี้<br>คือบ้านของคนที่ปฏิเสธเขา?'],
];
const TAGS = [
  [47.5, 52.5, 'เศาะฮีห์มุสลิม 2937'],
  [56.5, 62, 'ความหมายจาก เศาะฮีห์อัลบุคอรี 7122 · เศาะฮีห์มุสลิม 2939'],
];
const SKY = `<linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e2cf"/><stop offset="1" stop-color="#f6dca6"/></linearGradient>`;
const GOLD = ['#f2c14e', '#e8b04a', '#d9d9d9', '#f7d27a', '#c0c0c8'];

// ruins of a collapsed building
const ruins = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" fill="#8a7a66" stroke="#6a5a48" stroke-width="4">
  <path d="M-300 0 L-280 -120 L-220 -150 L-200 -260 L-120 -240 L-90 -140 L-20 -170 L40 -90 L110 -200 L150 -120 L230 -140 L300 0Z"/>
  <path d="M-200 -260 L-190 -330 L-150 -320 L-160 -250" fill="#9a8a74"/><path d="M110 -200 L120 -280 L150 -270 L140 -190" fill="#9a8a74"/>
  <path d="M-120 -60 h80 M30 -50 h90 M-250 -30 h60" stroke="#5a4a3a"/></g>`;
// a swarm of treasure particles (gold, silver, coins)
const swarm = (id, n, sd) => { seed = sd; return `<g id="${id}">${Array.from({ length: n }, (_, i) =>
  `<g class="tp" data-a="${rnd() * 6.283}" data-r="${20 + rnd() * 120}" data-s="${.6 + rnd() * 1.2}" data-o="${rnd()}"><ellipse rx="${6 + rnd() * 8}" ry="${4 + rnd() * 6}" fill="${GOLD[i % 5]}"/></g>`).join('')}</g>`; };
const updSwarm = (id, cx, cy, t, spread = 1, op = 1) => document.querySelectorAll(`#${id} .tp`).forEach(p => {
  const a = +p.dataset.a + t * +p.dataset.s, r = +p.dataset.r * spread;
  p.setAttribute('transform', `translate(${cx + Math.cos(a) * r} ${cy + Math.sin(a * 1.3) * r * .55}) rotate(${a * 60})`);
  p.setAttribute('opacity', op * (.6 + .4 * Math.sin(t * 6 + +p.dataset.o * 6)));
});
// a top-down head-and-shoulders (crowd seen from a rooftop)
const topPerson = (x, y, c) => `<g transform="translate(${x} ${y})"><ellipse rx="18" ry="12" fill="${c}"/><circle r="9" fill="#2a1a12"/></g>`;

function build() {
  // ---- 1. gold rising from rubble in the dust ----
  KIT.S('sRubble', `<defs>${SKY}<radialGradient id="dust"><stop offset="0" stop-color="#e6d2a8" stop-opacity=".6"/><stop offset="1" stop-color="#e6d2a8" stop-opacity="0"/></radialGradient></defs>
    <rect width="1080" height="1920" fill="url(#sk)"/><rect y="980" width="1080" height="940" fill="#b89a72"/>
    ${ruins(540, 1000, 1.4)}
    <circle cx="540" cy="900" r="520" fill="url(#dust)"/>
    ${swarm('sw1', 70, 5)}`);

  // ---- 2. the medicine box on the wooden table; Harith's hand slowly pulls back ----
  KIT.S('sTable', `<defs><radialGradient id="tg"><stop offset="0" stop-color="#ffb35c" stop-opacity=".3"/><stop offset="1" stop-color="#ffb35c" stop-opacity="0"/></radialGradient></defs>
    <rect width="1080" height="1920" fill="#2a1d14"/><circle cx="540" cy="820" r="620" fill="url(#tg)"/>
    <path d="M0 760 L1080 700 L1080 1300 L0 1300Z" fill="#6b4a32"/>
    ${Array.from({ length: 6 }, (_, i) => `<path d="M0 ${800 + i * 90} L1080 ${742 + i * 90}" stroke="#5a3d28" stroke-width="4"/>`).join('')}
    <g transform="translate(540 860)"><rect x="-130" y="-80" width="260" height="160" rx="10" fill="#efe8da"/><rect x="-130" y="-80" width="260" height="40" rx="10" fill="#d9d0bf"/>
      <rect x="-100" y="-20" width="34" height="80" fill="#c0392b"/><rect x="-120" y="2" width="74" height="34" fill="#c0392b"/>
      <rect x="-20" y="-6" width="120" height="12" rx="6" fill="#b8ae9c"/><rect x="-20" y="22" width="90" height="12" rx="6" fill="#b8ae9c"/></g>
    <g id="hArm"><path d="M1200 700 C1000 760 800 820 700 860" stroke="#1c1f27" stroke-width="90" fill="none" stroke-linecap="round"/></g>`);

  // ---- 3. Harith at the door: his old friend's eyes, warm again ----
  KIT.S('sFriend', `<defs><linearGradient id="dn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2236"/><stop offset="1" stop-color="#2c3448"/></linearGradient>
      <radialGradient id="warm"><stop offset="0" stop-color="#ffb35c" stop-opacity=".35"/><stop offset="1" stop-color="#ffb35c" stop-opacity="0"/></radialGradient></defs>
    <rect width="1080" height="1920" fill="#1a120c"/><rect x="200" y="200" width="680" height="1000" fill="url(#dn)"/>
    <g transform="translate(540 1200) scale(1.3)">${KIT.harith('fh')}</g>
`);

  // ---- 4. Salma spoons the medicine; Hawa's fever comes down (warm colours, as in EP01) ----
  KIT.S('sMed', `<defs><radialGradient id="mw"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".4"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient></defs>
    <rect width="1080" height="1920" fill="#6a5440"/><circle cx="540" cy="760" r="620" fill="url(#mw)"/>
    <g transform="rotate(-10 540 800)">
      <path d="M300 640 C230 860 250 1060 340 1140 L740 1140 C830 1060 850 860 780 640Z" fill="#2a1a12"/>
      <circle cx="540" cy="760" r="250" fill="#c99a7b"/>
      <path d="M290 760 C270 500 520 420 690 470 C800 520 820 640 790 700 C740 600 560 560 420 620 C360 660 320 700 300 800Z" fill="#2a1a12"/>
      <circle id="ch1" cx="420" cy="860" r="40" fill="#e0705a" opacity=".45"/><circle id="ch2" cx="660" cy="860" r="40" fill="#e0705a" opacity=".45"/>
      <path d="M440 795 q30 16 60 0 M580 795 q30 16 60 0" stroke="#5a3a2a" stroke-width="7" fill="none" stroke-linecap="round"/>
      <ellipse cx="540" cy="905" rx="22" ry="14" fill="#8a5040"/>
    </g>
    <g id="spoon"><path d="M1200 1100 C1000 1040 800 980 640 940" stroke="#3d4f57" stroke-width="110" fill="none" stroke-linecap="round"/>
      <rect x="560" y="900" width="140" height="18" rx="9" fill="#c8c8cc" transform="rotate(-18 560 900)"/><ellipse cx="560" cy="925" rx="34" ry="20" fill="#d8d8dc"/></g>`);

  // ---- 5. the city shakes with the sound of a crowd ----
  seed = 14;
  let skyline = '';
  for (let x = -20; x < 1100;) { const w = 80 + rnd() * 120, h = 200 + rnd() * 300; skyline += `<rect x="${x}" y="${1060 - h}" width="${w}" height="${h + 60}"/>`; x += w - 4; }
  KIT.S('sCity', `<defs>${SKY}<radialGradient id="dust2" cx="90%" cy="70%"><stop offset="0" stop-color="#e6c896" stop-opacity=".8"/><stop offset="1" stop-color="#e6c896" stop-opacity="0"/></radialGradient></defs>
    <rect width="1080" height="1920" fill="url(#sk)"/><rect id="cityDust" width="1080" height="1920" fill="url(#dust2)" opacity="0"/>
    <g id="skyline" fill="#7a6a58">${skyline}</g><rect y="1100" width="1080" height="820" fill="#5a4a3a"/>`);

  // ---- 6. from the rooftop: a river of people from the east; the man in the middle, seen from above ----
  seed = 19;
  let ppl = '';
  for (let i = 0; i < 260; i++) ppl += `<g class="pp" data-u="${rnd()}" data-v="${rnd() * 2 - 1}" data-c="${['#7d6a8a', '#5f7d6a', '#8a6a52', '#6a7a8f', '#9a7f5a', '#5a5f72'][i % 6]}">${topPerson(0, 0, ['#7d6a8a', '#5f7d6a', '#8a6a52', '#6a7a8f', '#9a7f5a', '#5a5f72'][i % 6])}</g>`;
  KIT.S('sRiver', `<rect width="1080" height="1920" fill="#c9b18a"/>
    <path id="road" d="M1180 260 C900 420 700 520 560 700 C420 880 300 1000 -100 1140" stroke="#a8916c" stroke-width="330" fill="none"/>
    ${Array.from({ length: 10 }, (_, i) => `<rect x="${(i * 211) % 1000}" y="${(i * 377) % 1200 + 120}" width="${120 + (i * 37) % 80}" height="${100 + (i * 53) % 90}" fill="#8a7a66" opacity=".9"/>`).join('')}
    <g id="ppl">${ppl}</g>
    <g id="man"><ellipse cx="0" cy="40" rx="60" ry="20" fill="#000" opacity=".25"/><ellipse rx="44" ry="30" fill="#14171d"/><circle r="20" fill="#0c0d10"/></g>
    <circle id="manRing" r="90" fill="none" stroke="#e9c47e" stroke-width="3" opacity=".0"/>`);

  // ---- 7. before the ruin, seen from behind: treasure rises and swarms after him ----
  seed = 27;
  let crowdBack = '';
  for (let i = 0; i < 14; i++) crowdBack += `<g class="cb" data-i="${i}" transform="translate(${40 + i * 75} ${1150 + (i % 2) * 30})"><rect x="-26" y="-130" width="52" height="130" rx="22" fill="#2a2522"/><circle cy="-150" r="24" fill="#1e1a17"/><rect class="arm" x="16" y="-200" width="14" height="80" rx="7" fill="#2a2522" opacity="0"/></g>`;
  KIT.S('sSwarm', `<defs>${SKY}</defs><rect width="1080" height="1920" fill="url(#sk)"/>
    <rect y="980" width="1080" height="940" fill="#b89a72"/>${ruins(560, 1000, 1.3)}
    ${swarm('sw2', 120, 33)}
    <g id="manBack" transform="translate(540 1120)"><path d="M-70 0 C-80 -100 -66 -170 -40 -200 L40 -200 C66 -170 80 -100 70 0Z" fill="#0f1014"/><rect x="-14" y="-230" width="28" height="34" fill="#0f1014"/><ellipse cy="-262" rx="40" ry="46" fill="#0f1014"/></g>
    ${crowdBack}`);

  // ---- 9. Adam's hands, cold, gripping the roof ledge ----
  KIT.S('sHands', `<defs>${SKY}<linearGradient id="par" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b29a78"/><stop offset="1" stop-color="#8a7258"/></linearGradient></defs>
    <rect width="1080" height="1920" fill="url(#sk)"/>
    <g fill="#9a8a74" opacity=".7">${[[40, 620, 180, 260], [260, 560, 140, 320], [760, 600, 200, 280], [900, 540, 160, 340]].map(([x, y, w, h]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}"/>`).join('')}</g>
    <rect y="900" width="1080" height="1020" fill="#6e5a44"/>
    <rect x="0" y="755" width="1080" height="150" fill="url(#par)"/>
    ${[0, 1, 2, 3, 4, 5, 6].map(k => `<line x1="${k * 170 + 60}" y1="770" x2="${k * 170 + 60}" y2="905" stroke="#7e6850" stroke-width="3" opacity=".5"/>`).join('')}
    <g id="aHands">
      <path d="M-80 1500 C80 1200 230 950 370 775" stroke="#cdbb9a" stroke-width="110" fill="none" stroke-linecap="round"/>
      <path d="M1160 1500 C1000 1200 850 950 710 775" stroke="#cdbb9a" stroke-width="110" fill="none" stroke-linecap="round"/>
      <path d="M150 1150 C230 1000 300 880 350 820 M930 1150 C850 1000 780 880 730 820" stroke="#bba985" stroke-width="8" fill="none"/></g>
    <rect x="0" y="735" width="1080" height="26" fill="#c4ac88"/>
    <rect x="0" y="759" width="1080" height="10" fill="#6e5a44" opacity=".35"/>
    <rect id="chill" width="1080" height="1920" fill="#9fc3e0" opacity="0"/>`);

  // ---- 10a. the procession turns into Adam's alley; he stops under the roof (from above) ----
  seed = 41;
  let alley = '';
  for (let i = 0; i < 90; i++) alley += `<g class="ap" data-u="${rnd()}" data-v="${rnd() * 2 - 1}">${topPerson(0, 0, ['#7d6a8a', '#5f7d6a', '#8a6a52', '#6a7a8f'][i % 4])}</g>`;
  KIT.S('sAlley', `<rect width="1080" height="1920" fill="#8a7a66"/>
    <rect x="300" y="0" width="480" height="1920" fill="#b8a07a"/>
    <rect x="0" y="0" width="300" height="1920" fill="#9a8a74"/><rect x="780" y="0" width="300" height="1920" fill="#9a8a74"/>
    <rect x="180" y="560" width="160" height="300" fill="#6a5a48" opacity=".5"/>
    ${alley}
    <g id="man2"><ellipse cx="0" cy="40" rx="60" ry="20" fill="#000" opacity=".25"/><ellipse rx="44" ry="30" fill="#14171d"/><circle id="m2head" r="20" fill="#0c0d10"/></g>`);

  // ---- 10b. low angle from the street up at Adam on the roof edge; cut before any face is seen ----
  // seen from the street: verticals converge on a point above the frame
  const VP = [540, -300], P = (xb, y) => VP[0] + (xb - VP[0]) * (y - VP[1]) / (1920 - VP[1]);
  const quad = (x0, x1, y0, y1, fill, extra = '') => `<polygon points="${P(x0, y0)},${y0} ${P(x1, y0)},${y0} ${P(x1, y1)},${y1} ${P(x0, y1)},${y1}" fill="${fill}" ${extra}/>`;
  let wins = '';
  [[-60, 220], [860, 1140]].forEach(([a, b]) => [[1700, 1900], [1240, 1400], [900, 1010]].forEach(([y0, y1]) => {
    wins += quad(a, b, y0, y1, '#3a3a44') + quad(a + 18, b - 18, y0 + 14, y0 + 30, '#6a7a8a', 'opacity=".5"');
  }));
  KIT.S('sUp', `<defs><linearGradient id="up" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8d2da"/><stop offset="1" stop-color="#f3e6c6"/></linearGradient>
      <linearGradient id="fac" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8a07c"/><stop offset="1" stop-color="#6e5843"/></linearGradient>
      <radialGradient id="glow" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#fff8e6" stop-opacity=".9"/><stop offset="1" stop-color="#fff8e6" stop-opacity="0"/></radialGradient></defs>
    <rect width="1080" height="1920" fill="url(#up)"/><rect width="1080" height="900" fill="url(#glow)"/>
    <polygon points="0,1920 0,240 ${P(-420, 420)},420 ${P(-420, 1920)},1920" fill="#5e4c3a"/>
    <polygon points="1080,1920 1080,200 ${P(1500, 380)},380 ${P(1500, 1920)},1920" fill="#54443a"/>
    ${quad(-200, 1280, 690, 1920, 'url(#fac)')}
    ${Array.from({ length: 9 }, (_, k) => `<line x1="${P(-200 + k * 185, 690)}" y1="690" x2="${-200 + k * 185}" y2="1920" stroke="#5e4a36" stroke-width="2" opacity=".25"/>`).join('')}
    ${wins}
    <clipPath id="behindPar"><rect x="0" y="0" width="1080" height="556"/></clipPath><g clip-path="url(#behindPar)"><g transform="translate(540 760) scale(.75)">${KIT.adam('ua')}</g></g>
    ${quad(-240, 1320, 548, 562, '#c9b28e')}
    ${quad(-240, 1320, 562, 650, '#9a8264')}
    ${quad(-260, 1340, 650, 690, '#4e3c2c')}
    ${quad(-200, 1280, 690, 760, '#000', 'opacity=".22"')}`);
}

KIT.episode({
  num: 5, name: 'ขุมทรัพย์ที่เดินตามเขา',
  total: 94.8, title: [5.6, 9.6], ctaWin: [77.8, 83.8], discWin: [83.8, 90.3], outroAt: 90.3,
  cta: '“ถ้าคุณเห็นปาฏิหาริย์แบบนั้นกับตาตัวเอง<br><b>หัวใจคุณจะยังมั่นคงไหม?</b><br>คอมเมนต์บอกกันด้วย<br>แล้วกดติดตามและแชร์ไว้<br>ตอนหน้าเราจะได้เห็นใบหน้าของเขา”',
  refs: 'หลักฐานหลัก: เศาะฮีห์มุสลิม 2937<br>เศาะฮีห์อัลบุคอรี 7122',
  scenes: [
    ['sRubble', 0, 9.8], ['sTable', 9.6, 19.7], ['sFriend', 19.5, 24.2], ['sMed', 24, 28.7], ['sCity', 28.5, 32.7],
    ['sRiver', 32.5, 41.2], ['sSwarm', 41, 56.7], ['sHands', 56.5, 62.2], ['sAlley', 62, 66.7],
    ['sUp', 66.5, 77.5, { hardOut: true }], ['sCity', 89.9, 95],
  ],
  caps: CAPS, tags: TAGS,
  keys: [[1.5, 1], [7.5, 2], [11.5, 3], [17, 4], [22, 5], [26.5, 6], [30.5, 7], [35, 8], [39, 9], [43, 10], [46, 11], [50, 12], [54.5, 13], [59, 14], [64, 15], [68, 16], [71, 17], [75.5, 18], [80.5, 19], [87, 20], [93, 21]],
  build,
  draw(t) {
    // 1. sparkles rise from the rubble and drift off together
    updSwarm('sw1', lerp(540, 820, ease((t - 2) / 7)), lerp(900, 520, ease((t - .5) / 5)), t, .4 + .6 * ease(t / 3), ease(t / 1.2));
    KIT.zoom('sRubble', 1 + Math.min(t, 10) * .008);

    // 2. Harith's arm withdraws slowly from the box
    attr('hArm', 'transform', `translate(${ease((t - 15.5) / 3) * 520} ${ease((t - 15.5) / 3) * -140})`);
    KIT.zoom('sTable', 1 + clamp(t - 9.6, 0, 10) * .006);

    // 3. Harith's eyes: warm, not the cold light of EP01-04
    ['EyeL', 'EyeR'].forEach(e => { attr('fh' + e, 'fill', '#ffd9a0'); attr('fh' + e, 'opacity', .5 + .4 * ease((t - 20) / 1.5)); });
    KIT.zoom('sFriend', 1 + clamp(t - 19.5, 0, 5) * .012);

    // 4. the spoon comes in; the fever flush fades
    const sp = ease((t - 24.2) / 1.2);
    attr('spoon', 'transform', `translate(${(1 - sp) * 500} ${(1 - sp) * 260})`);
    ['ch1', 'ch2'].forEach(id => attr(id, 'opacity', .45 - .3 * ease((t - 25.8) / 2.5)));

    // 5. the skyline trembles, dust rises in the east
    const q = t > 28.6 && t < 32.7 ? Math.sin(t * 50) * 3 + Math.sin(t * 31) * 2 : 0;
    attr('skyline', 'transform', `translate(${q} ${Math.abs(q) * .4})`);
    attr('cityDust', 'opacity', t < 30 ? ease((t - 28.6) / 1.5) : 1);

    // 6. the river of people flows in along the road; the man at its centre
    const road = $('road'), L = road.getTotalLength();
    document.querySelectorAll('#sRiver .pp').forEach(p => {
      const u = (+p.dataset.u + (t - 32.5) * .05) % 1, pt = road.getPointAtLength(L * (1 - u)), pt2 = road.getPointAtLength(Math.max(0, L * (1 - u) - 4));
      const nx = -(pt2.y - pt.y), ny = pt2.x - pt.x, nl = Math.hypot(nx, ny) || 1;
      p.setAttribute('transform', `translate(${pt.x + nx / nl * +p.dataset.v * 130} ${pt.y + ny / nl * +p.dataset.v * 130})`);
    });
    const mp = road.getPointAtLength(L * (1 - ((t - 32.5) * .05 + .35) % 1));
    attr('man', 'transform', `translate(${mp.x} ${mp.y})`);
    attr('manRing', 'transform', `translate(${mp.x} ${mp.y})`); attr('manRing', 'opacity', .5 * ease((t - 37.2) / .8) * (t < 41 ? 1 : 0));
    KIT.zoom('sRiver', 1 + clamp(t - 32.5, 0, 9) * .006);

    // 7-8. the treasure lifts out of the ruin and swarms after him; the crowd throws up its arms
    const lift = ease((t - 47.6) / 2.5), follow = ease((t - 50) / 4);
    updSwarm('sw2', lerp(560, 760, follow), lerp(980, 640, lift), t, .3 + .7 * lift, t > 47.4 ? ease((t - 47.4) / .8) : 0);
    attr('manBack', 'transform', `translate(${540 + 220 * follow} 1120)`);
    document.querySelectorAll('#sSwarm .cb').forEach(g => {
      const i = +g.dataset.i, up = ease((t - 52.6 - (i % 5) * .15) / .5);
      g.querySelector('.arm').setAttribute('opacity', up); g.querySelector('.arm').setAttribute('transform', `rotate(${-20 + 10 * Math.sin(t * 8 + i)} 23 -130)`);
    });
    KIT.zoom('sSwarm', 1 + clamp(t - 41, 0, 15) * .005);

    // 9. his hands tremble on the ledge, the light turns cold
    const tr = Math.sin(t * 37) * 2 + Math.sin(t * 23) * 1.5;
    attr('aHands', 'transform', `translate(${tr} ${tr * .5})`); attr('chill', 'opacity', .18 * ease((t - 57) / 2));

    // 10a. into the alley; he stops beneath the roof
    const ad = document.querySelectorAll('#sAlley .ap'), stop = ease((t - 62) / 3.5);
    ad.forEach(p => { const u = (+p.dataset.u + (t - 62) * .06 * (1 - stop * .8)) % 1; p.setAttribute('transform', `translate(${540 + +p.dataset.v * 200} ${-60 + u * 2040})`); });
    attr('man2', 'transform', `translate(540 ${lerp(1500, 760, stop)})`);
    attr('m2head', 'transform', `translate(0 ${-8 * ease((t - 66.6) / 2)})`);   // the head tips back: we stay above it

    // 10b. low angle up at Adam; slow push, then the cut to black (before any face)
    KIT.zoom('sUp', 1 + clamp(t - 66.5, 0, 11) * .01);
  },
});
</script>
