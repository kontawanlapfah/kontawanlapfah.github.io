<script>
// Narration: verbatim from the series document, EP12 (Hook / script / closing / CTA).
// One caption per line: align.py reads this list.
// The Prophet Isa (peace be upon him) is never shown: the camp is seen from Adam's lowered eyes, only feet,
// shadows and warm light (visual guide 2). Ya'juj and Ma'juj are not drawn. No Qur'anic text is drawn: the
// recitation is verse numbers 1-10 only, and the small mushaf from his mother stays closed.
const CAPS = [
  [0, 5.6, '', 'ผมไม่กล้าเงยหน้าขึ้นมองท่าน…<br>ผมรู้แค่ว่าการทดสอบทั้งหมดที่ผ่านมา<br>มีความหมายในวินาทีนั้น'],
  [9.6, 13, '', 'ท่านนบีอีซามาที่ค่ายของเราจริง ๆ'],
  [13, 18, '', 'ผู้คนยืนนิ่งเป็นแถว ผมก้มหน้ามองพื้นตลอดเวลา<br>จับมือฮาวากับซัลมาไว้แน่น'],
  [18, 24, '', 'ท่านเดินผ่านผู้คน ลูบใบหน้าของพวกเขา<br>และบอกเล่าถึงระดับชั้นของพวกเขาในสวรรค์'],
  [24, 27.5, '', 'ผมได้ยินเสียงคนรอบตัวสะอื้น<br>ผมเองก็เช่นกัน'],
  [27.5, 32, '', 'แต่ก่อนรุ่งเช้า ข่าวใหม่ก็มาถึง<br>อัลลอฮ์ทรงแจ้งแก่ท่านว่า<br>มีบ่าวกลุ่มหนึ่งของพระองค์ถูกปล่อยออกมา'],
  [32, 36, '', 'ไม่มีใครสามารถต่อสู้กับพวกเขาได้<br>ให้นำบ่าวของพระองค์หลบขึ้นไปยังภูเขาฏูร'],
  [36, 38.5, 'big', 'ยะอ์ญูจและมะอ์ญูจ'],
  [38.5, 44, '', 'ผมเคยคิดว่าการทดสอบจบลงแล้ว<br>แต่ผมเพิ่งเข้าใจว่า<br>ตราบใดที่ยังมีชีวิต การทดสอบไม่เคยจบ'],
  [44, 48.5, '', 'เราออกเดินทางตามผู้คนขึ้นเขาอีกครั้ง<br>ฮาริสเดินข้างผม ท่องอัลกะฮ์ฟ์เบา ๆ'],
  [48.5, 54, '', 'ระหว่างทาง ฮาวาดึงมือผม<br>แล้วท่องสิบอายะฮ์แรกให้ฟังจนครบ<br>ไม่ผิดเลยสักคำ'],
  [54, 58, '', 'ผมนึกถึงข้อความเสียงสุดท้ายของแม่<br>ที่ทำให้ทุกอย่างเริ่มต้นขึ้น'],
  [58, 65, '', 'สิ่งที่ปกป้องเราตลอดสี่สิบวันนั้น<br>ไม่ใช่ขนมปัง ไม่ใช่ยา และไม่ใช่ความกล้าของผม<br>แต่คือความรู้ไม่กี่อย่างที่แม่สอน<br>ที่ครูย้ำ และที่ผมเกือบลืมไป'],
  [65, 70, 'big', 'สิบอายะฮ์<br>ดุอาอ์ก่อนให้สลาม<br>และคำเตือนให้อยู่ห่างจากเขา'],
  [70, 77, 'q', '<span class="n">ผมกอดลูกไว้<br>แล้วกระซิบประโยคเดียวกับที่แม่เคยบอกผม</span><br>“ท่องสิบอายะฮ์แรกของอัลกะฮ์ฟ์ไว้นะลูก…<br>พ่อไม่ได้สอนเล่น ๆ”'],
  [77, 82, 'big', 'แล้วคุณล่ะ วันนี้คุณท่องสิบอายะฮ์แรก<br>ของซูเราะฮ์อัลกะฮ์ฟ์ได้กี่อายะฮ์แล้ว?'],
];
const TAGS = [
  [18, 24, 'เศาะฮีห์มุสลิม 2937'],
  [27.5, 38.5, 'เศาะฮีห์มุสลิม 2937 · อัลกุรอาน 21:96'],
  [65, 70, 'เศาะฮีห์มุสลิม 809 · 588 · สุนันอบีดาวูด 4319'],
];

const SK = '#c99a7b', HR = '#2a1a12';
{ const base = KIT.hawa; KIT.hawa = p => base(p).replace('<path d="M-50 -272 C-64 -210 -62 -165 -50 -140 L50 -140 C62 -165 64 -210 50 -272Z"',
  '<path d="M0 -332 C-44 -332 -62 -300 -60 -262 C-64 -210 -62 -165 -50 -140 L50 -140 C62 -165 64 -210 60 -262 C62 -300 44 -332 0 -332Z"'); }
{ const baseA = KIT.adam; KIT.adam = p => baseA(p).replace(/(<g id="\w+Arm[LR]"><rect [^>]*?)fill="#cdbb9a"/g, '$1fill="#bca986"'); }
const withHands = svg => svg.replace(/(<g id="\w+Arm[LR]"><rect x="(-?\d+)" y="-228" width="18" height="98" rx="9" fill="[^"]+"\/>)/g,
  (m, a, x) => `${a}<circle cx="${+x + 9}" cy="-130" r="13" fill="${SK}"/>`);
const shadow = (x, y, rx, o = .25) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${rx * .16}" fill="#000" opacity="${o}"/>`;
const HSHIRT = '#6e727c', HPANTS = '#4a4038', HSKIN = '#b98e72';
// profile walker facing right (legs swing from the hip). Origin at the feet.
const walker = (cls, c, i, extra = '') => `<g class="${cls}" data-i="${i}">
  <g class="lA"><rect x="-11" y="-160" width="22" height="160" rx="10" fill="${c[1]}"/></g><g class="lB"><rect x="-11" y="-160" width="22" height="160" rx="10" fill="${c[1]}"/></g>
  <path d="M-32 -150 C-38 -230 -30 -290 -20 -310 L22 -310 C34 -290 38 -230 32 -150Z" fill="${c[0]}"/>
  <path d="M-4 -290 C-16 -250 -18 -210 -12 -186" stroke="${c[0]}" stroke-width="22" fill="none" stroke-linecap="round"/><circle cx="-12" cy="-180" r="11" fill="${c[3] || SK}"/>
  <rect x="-10" y="-332" width="20" height="26" fill="${c[3] || SK}"/><circle cy="-360" r="32" fill="${c[3] || SK}"/><path d="M-32 -362 C-34 -400 34 -400 32 -362 C20 -384 -20 -384 -32 -362Z" fill="${c[2]}"/>
  ${extra}</g>`;
const stepLegs = (sel, t, amp = 20) => document.querySelectorAll(sel).forEach(g => {
  const ph = t * 3.6 + +g.dataset.i * 1.3, sw = Math.sin(ph) * amp;
  g.querySelector('.lA').setAttribute('transform', `rotate(${sw} 0 -150)`); g.querySelector('.lB').setAttribute('transform', `rotate(${-sw} 0 -150)`);
});

function build() {
  // ---- hook: Adam's hand holding his daughter's hand tight; head bowed ----
  KIT.S('sHands', `<defs><radialGradient id="hw" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#e8c898"/><stop offset="1" stop-color="#6a5040"/></radialGradient></defs>
    <rect width="1080" height="1920" fill="url(#hw)"/>
    <path d="M-80 300 C200 420 380 560 470 660" stroke="#bca986" stroke-width="150" fill="none" stroke-linecap="round"/>
    <path d="M1160 1000 C960 900 760 820 650 760" stroke="#a8583f" stroke-width="90" fill="none" stroke-linecap="round"/>
    <g id="kidHand"><ellipse cx="610" cy="740" rx="56" ry="48" fill="${SK}"/>${[0, 1, 2, 3].map(k => `<rect x="${540 - k * 4}" y="${700 + k * 22}" width="44" height="18" rx="9" fill="${SK}"/>`).join('')}</g>
    <g id="bigHand"><ellipse cx="520" cy="700" rx="96" ry="78" fill="${SK}" stroke="#a87a5e" stroke-width="3"/>
      ${[0, 1, 2, 3].map(k => `<path d="M${560 + k * 4} ${648 + k * 30} C${620 + k * 4} ${652 + k * 30} ${650} ${676 + k * 30} ${640} ${700 + k * 30}" stroke="${SK}" stroke-width="26" fill="none" stroke-linecap="round"/>`).join('')}
      <path d="M470 640 C500 610 540 600 570 610" stroke="${SK}" stroke-width="30" fill="none" stroke-linecap="round"/></g>`);

  // ---- the camp, seen from Adam's lowered eyes: the ground, feet in a row, long shadows, warm light passing ----
  seed = 7;
  let feet = '';
  for (let i = 0; i < 9; i++) { const x = 60 + i * 120 + (rnd() - .5) * 20, c = ['#3a3448', '#4a3e3a', '#2e3a44', '#4a4450', '#5a4a3e'][i % 5];
    feet += `<g transform="translate(${x} 640)"><path d="M-46 -640 L-40 -40 L40 -40 L46 -640Z" fill="${c}"/><ellipse cx="-18" cy="-28" rx="26" ry="14" fill="#1e1a17"/><ellipse cx="18" cy="-28" rx="26" ry="14" fill="#1e1a17"/>
      <path class="sh" d="M-30 -20 L-130 380 L-30 380 L30 -20Z" fill="#000" opacity=".22"/></g>`; }
  KIT.S('sGround', `<defs><radialGradient id="pass"><stop offset="0" stop-color="#fff2cc" stop-opacity=".85"/><stop offset="1" stop-color="#fff2cc" stop-opacity="0"/></radialGradient></defs>
    <rect width="1080" height="1920" fill="#7a6250"/><rect y="600" width="1080" height="1320" fill="#a48468"/>
    ${Array.from({ length: 30 }, () => `<ellipse cx="${rnd() * 1080}" cy="${640 + rnd() * 500}" rx="${4 + rnd() * 10}" ry="${2 + rnd() * 4}" fill="#8a6e56"/>`).join('')}
    <g id="feetG">${feet}</g>
    <circle id="passLight" cx="-200" cy="420" r="420" fill="url(#pass)"/>
    <g transform="translate(540 1040)"><path d="M-120 0 L-110 -60 L-30 -60 L-24 0Z M24 0 L30 -60 L110 -60 L120 0Z" fill="#3a3a44"/><ellipse cx="-72" cy="2" rx="56" ry="18" fill="#1e1a17"/><ellipse cx="72" cy="2" rx="56" ry="18" fill="#1e1a17"/></g>
    ${[0, 1, 2, 3].map(k => `<ellipse id="tear${k}" rx="7" ry="10" fill="#cfeaff" opacity="0"/>`).join('')}
    ${[0, 1, 2, 3].map(k => `<ellipse id="spot${k}" cx="${470 + k * 46}" cy="${960 + (k % 2) * 16}" rx="12" ry="5" fill="#6a5040" opacity="0"/>`).join('')}`);

  // ---- before dawn: the news; the camp rises; the horizon darkens (nothing of them is drawn) ----
  seed = 13;
  let camp = '';
  for (let i = 0; i < 14; i++) { const x = rnd() * 1080, s = .4 + rnd() * .3; camp += `<g transform="translate(${x} ${900 + s * 200}) scale(${s})"><path d="M-40 0 C-46 -110 -40 -190 -28 -216 L28 -216 C40 -190 46 -110 40 0Z" fill="#1a1e2c"/><circle cy="-246" r="30" fill="#1a1e2c"/></g>`; }
  KIT.S('sNews', `<defs><linearGradient id="nd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e1c"/><stop offset="1" stop-color="#2a3050"/></linearGradient>
      <linearGradient id="haze" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#1a1210" stop-opacity=".9"/><stop offset="1" stop-color="#1a1210" stop-opacity="0"/></linearGradient></defs>
    <rect width="1080" height="1920" fill="url(#nd)"/>
    ${Array.from({ length: 50 }, () => `<circle cx="${rnd() * 1080}" cy="${rnd() * 700}" r="${1 + rnd() * 2}" fill="#dfe6f2" opacity="${.3 + rnd() * .5}"/>`).join('')}
    <path d="M620 820 L820 520 L1000 820Z" fill="#20263a"/>
    <rect id="hz" x="0" y="560" width="1080" height="300" fill="url(#haze)" opacity="0"/>
    <path d="M-20 860 L1100 860 L1100 1920 L-20 1920Z" fill="#141826"/>
    ${[[120, 850], [380, 860], [700, 850], [940, 862]].map(([x, y]) => `<path d="M${x - 80} ${y + 20} L${x} ${y - 80} L${x + 80} ${y + 20}Z" fill="#262a3c"/>`).join('')}
    <g id="campG">${camp}</g>`);

  // ---- dawn on the mountain: the procession climbs; Harith walks beside Adam ----
  seed = 29;
  let line = '';
  for (let i = 0; i < 12; i++) { const k = i / 11, x = 60 + k * 900, y = 1060 - k * 420, s = .62 - k * .4; line += `<g transform="translate(${x} ${y}) scale(${s})">${walker('pw', [['#4a4450', '#2e2a30', HR], ['#5a4a3e', '#3a302a', HR], ['#3d4f57', '#3d4f57', '#56707a', '#56707a']][i % 3], i + 5)}</g>`; }
  KIT.S('sClimb', `<defs><linearGradient id="dn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a6a96"/><stop offset=".55" stop-color="#e8a878"/><stop offset="1" stop-color="#f6d6a0"/></linearGradient></defs>
    <rect width="1080" height="1920" fill="url(#dn)"/><circle cx="880" cy="560" r="80" fill="#ffe2a8" opacity=".9"/>
    <path d="M-20 700 L360 300 L700 620 L1100 260 L1100 1920 L-20 1920Z" fill="#7a6058"/>
    <path d="M-20 1120 L1100 600 L1100 1920 L-20 1920Z" fill="#9a7a64"/>
    <path d="M-20 1110 L1100 590" stroke="#b8967a" stroke-width="30"/>
    ${line}
    <g id="pair" transform="translate(320 1000)">
      <g transform="translate(0 0)">${shadow(0, 0, 60)}${walker('aw', ['#cdbb9a', '#3a3a44', HR], 1)}</g>
      <g transform="translate(150 -60)">${shadow(0, 0, 56)}${walker('aw', [HSHIRT, HPANTS, HR, HSKIN], 2)}</g>
      ${[0, 1, 2].map(k => `<path id="hum${k}" d="M210 -460 a30 30 0 0 1 0 50" stroke="#fff2cc" stroke-width="4" fill="none" opacity="0"/>`).join('')}</g>`);

  // ---- on the way: Hawa recites the first ten verses; numbers 1-10 light up as a light graphic ----
  KIT.S('sRecite', `<defs><linearGradient id="dn2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8aa8d8"/><stop offset="1" stop-color="#f6d6a0"/></linearGradient>
      <clipPath id="waistR"><rect width="1080" height="1100"/></clipPath></defs>
    <rect width="1080" height="1920" fill="url(#dn2)"/>
    <path d="M-20 820 L400 560 L760 760 L1100 520 L1100 1920 L-20 1920Z" fill="#9a7a64"/>
    <g clip-path="url(#waistR)"><g transform="translate(330 1480) scale(1.9)">${KIT.adam('ra')}</g>
      <g transform="translate(720 1480) scale(2.1)">${withHands(KIT.hawa('rh'))}</g>
      <path d="M440 980 C520 990 580 1000 640 1000" stroke="#bca986" stroke-width="40" fill="none" stroke-linecap="round"/><circle cx="650" cy="1000" r="24" fill="${SK}"/></g>
    <g font-family="Sans" font-weight="700" font-size="32" text-anchor="middle">
      ${Array.from({ length: 10 }, (_, i) => `<g id="v${i}" transform="translate(${180 + i * 80} 300)"><circle r="30" fill="none" stroke="#fff2cc" stroke-width="3"/><text y="11" fill="#fff2cc">${i + 1}</text></g>`).join('')}</g>`);

  // ---- memory: his mother's last voice message, the one that started everything ----
  KIT.S('sPhone', `<rect width="1080" height="1920" fill="#e6d6b8"/>
    <g transform="translate(540 700)"><rect x="-230" y="-420" width="460" height="840" rx="56" fill="#2a2622"/><rect x="-200" y="-370" width="400" height="740" rx="18" fill="#f4ede0"/>
      <rect x="-170" y="-60" width="330" height="110" rx="55" fill="#d8c8a8"/><circle cx="-120" cy="-5" r="34" fill="#6a5040"/><path d="M-130 -22 L-104 -5 L-130 12Z" fill="#f4ede0"/>
      ${Array.from({ length: 16 }, (_, i) => `<rect class="wv" data-i="${i}" x="${-70 + i * 14}" y="-5" width="8" height="10" rx="4" fill="#6a5040"/>`).join('')}</g>
    <rect width="1080" height="1920" fill="#e9c47e" opacity=".22"/>`);
  $('sPhone').querySelector('svg').style.filter = 'sepia(.55) blur(.5px)';

  // ---- not bread, not medicine, not courage: those fade; the small mushaf his mother gave him stays, closed, glowing ----
  KIT.S('sKeep', `<defs><radialGradient id="kg"><stop offset="0" stop-color="#ffe2a8" stop-opacity=".8"/><stop offset="1" stop-color="#ffe2a8" stop-opacity="0"/></radialGradient></defs>
    <rect width="1080" height="1920" fill="#2a2020"/>
    <g id="kBread">${KIT.bread(300, 640, 1.1)}</g>
    <g id="kMed" transform="translate(780 640)"><rect x="-110" y="-70" width="220" height="140" rx="10" fill="#efe8da"/><rect x="-80" y="-20" width="30" height="70" fill="#c0392b"/><rect x="-100" y="0" width="70" height="30" fill="#c0392b"/></g>
    <circle id="kGlow" cx="540" cy="760" r="380" fill="url(#kg)" opacity="0"/>
    <g id="kBook" opacity="0" transform="translate(540 780)"><rect x="-130" y="-170" width="260" height="340" rx="14" fill="#2f5a46"/><rect x="-118" y="-158" width="236" height="316" rx="10" fill="none" stroke="#e9c47e" stroke-width="5"/>
      <path d="M-60 -60 L0 -100 L60 -60 L60 40 L0 80 L-60 40Z" fill="none" stroke="#e9c47e" stroke-width="5"/><rect x="118" y="-170" width="18" height="340" rx="6" fill="#244836"/></g>`);

  // ---- he holds his daughter and whispers; then the camera pulls back to the mountain; the closing words ----
  KIT.S('sEnd', `<defs><linearGradient id="dn3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a7aa8"/><stop offset=".6" stop-color="#f0b880"/><stop offset="1" stop-color="#f6d6a0"/></linearGradient></defs>
    <rect width="1080" height="1920" fill="url(#dn3)"/>
    <g id="endCam">
      <path d="M-600 1200 L-100 500 L300 900 L700 420 L1200 860 L1700 1200 L1700 2400 L-600 2400Z" fill="#8a6c5c"/>
      <path d="M-600 1180 L540 1020 L1700 1180 L1700 2400 L-600 2400Z" fill="#a48468"/>
      <g transform="translate(540 1020) scale(.2)">${shadow(0, 0, 200, .3)}
        ${KIT.adamKneel('ea')}<g transform="translate(-20 0)">${KIT.hawa('eh').replace(/<\/g>\s*$/, `<path d="M-42 -300 C-52 -240 -58 -170 -50 -146 L50 -146 C58 -170 52 -240 42 -300 C30 -330 -30 -330 -42 -300Z" fill="${HR}"/></g>`)}</g>
        <path d="M-104 -350 C-150 -270 -110 -215 -40 -212" stroke="#bca986" stroke-width="32" fill="none" stroke-linecap="round"/><circle cx="-34" cy="-212" r="15" fill="${SK}"/>
        <path d="M28 -352 C70 -300 60 -240 -4 -226" stroke="#bca986" stroke-width="32" fill="none" stroke-linecap="round"/><circle cx="-10" cy="-225" r="15" fill="${SK}"/>
        ${[0, 1, 2].map(k => `<path id="wh${k}" d="M-10 -480 a24 24 0 0 1 0 40" stroke="#fff2cc" stroke-width="5" fill="none" opacity="0"/>`).join('')}</g></g>
    <g id="endText" opacity="0"><text x="540" y="380" text-anchor="middle" font-family="Serif" font-weight="700" font-size="72" fill="#fff6e0" style="filter: drop-shadow(0 4px 16px rgba(0,0,0,.45))">ท่องสิบอายะฮ์แรก</text>
      <text x="540" y="470" text-anchor="middle" font-family="Serif" font-weight="700" font-size="72" fill="#fff6e0" style="filter: drop-shadow(0 4px 16px rgba(0,0,0,.45))">ของอัลกะฮ์ฟ์</text></g>`);
}

KIT.episode({
  num: 12, name: 'หลังพายุ (ตอนจบ)',
  total: 100.3, title: [5.6, 9.6], ctaWin: [82.3, 89.3], discWin: [89.3, 95.8], outroAt: 95.8,
  cta: '“ขอบคุณที่เดินทางไปกับอาดัมจนจบ<br>คอมเมนต์บอกกันด้วยว่า<br>ตอนไหนทำให้คุณคิดมากที่สุด<br>และแชร์เรื่องนี้ให้คนที่คุณรัก<br><b>เพื่อให้เราเตรียมตัวไปด้วยกัน</b>”',
  refs: 'หลักฐานหลัก: เศาะฮีห์มุสลิม 2937, 809, 588<br>อัลกุรอาน 21:96, 18:94–99, 43:61, 4:159',
  scenes: [
    ['sHands', 0, 9.8], ['sGround', 9.6, 27.7], ['sNews', 27.5, 38.7], ['sClimb', 38.5, 48.7], ['sRecite', 48.5, 54.2],
    ['sPhone', 54, 58.2], ['sKeep', 58, 70.2], ['sEnd', 70, 82, { hardOut: true }], ['sClimb', 95.4, 100.5],
  ],
  caps: CAPS, tags: TAGS,
  keys: [[2.5, 1], [7.5, 2], [11, 3], [15.5, 4], [21, 5], [26, 6], [30, 7], [34, 8], [37.3, 9], [41, 10], [46, 11], [51, 12], [56, 13], [61, 14], [67.5, 15], [72, 16], [75.5, 17], [79.5, 18], [85, 19], [92, 20], [98, 21]],
  build,
  draw(t) {
    // hook: the grip tightens
    const g = ease((t - .6) / 1.2);
    attr('bigHand', 'transform', `translate(${-30 * (1 - g)} ${-20 * (1 - g)}) scale(${1 + .02 * Math.sin(t * 2)})`);
    KIT.zoom('sHands', 1 + Math.min(t, 10) * .008);

    // the camp from lowered eyes: warm light passes along the row (18-24); shadows swing; tears fall (24-27.5)
    const lp = clamp((t - 17.5) / 7);
    attr('passLight', 'cx', lerp(-260, 1340, lp)); attr('passLight', 'opacity', t > 17.5 && t < 25.5 ? 1 : 0);
    document.querySelectorAll('#sGround .sh').forEach((s, i) => { const x = 60 + i * 120, lx = lerp(-260, 1340, lp), sk = clamp((x - lx) / 600, -1, 1) * 40;
      s.setAttribute('transform', `skewX(${t > 17.5 && t < 25.5 ? sk : 0})`); });
    for (let k = 0; k < 4; k++) {
      const t0 = 24.2 + k * .8, ph = clamp((t - t0) / .7);
      attr('tear' + k, 'cx', 470 + k * 46); attr('tear' + k, 'cy', lerp(600, 960 + (k % 2) * 16, ph)); attr('tear' + k, 'opacity', ph > 0 && ph < 1 ? .9 : 0);
      attr('spot' + k, 'opacity', t > t0 + .7 ? .6 : 0);
    }
    KIT.zoom('sGround', 1 + clamp(t - 9.6, 0, 18) * .004);

    // the news: the camp gets up; at "Ya'juj and Ma'juj" a dark haze rises on the horizon (nothing is drawn of them)
    attr('campG', 'transform', `translate(0 ${-6 * ease((t - 28) / 2)})`);
    attr('hz', 'opacity', ease((t - 35.6) / 2) * .9);
    KIT.zoom('sNews', 1 + clamp(t - 27.5, 0, 11) * .006);

    // the climb: everyone walks up; Harith recites softly (arcs of sound) from 44
    stepLegs('#sClimb .pw, #sClimb .aw', t);
    attr('pair', 'transform', `translate(${320 + (t - 38.5) * 14} ${1000 - (t - 38.5) * 6.5})`);
    for (let k = 0; k < 3; k++) { const ph = ((t - 44.2) * .8 + k / 3) % 1; attr('hum' + k, 'opacity', t > 44.2 && t < 48.7 ? .8 * (1 - ph) : 0); attr('hum' + k, 'transform', `translate(${ph * 50} ${-ph * 14})`); }

    // Hawa recites 1-10 (48.8-53.4), each verse lights up
    KIT.poseHawa('rh', 0, 0, t, false);
    for (let i = 0; i < 10; i++) { const on = ease((t - 48.8 - i * .46) / .3); attr('v' + i, 'opacity', .25 + .75 * on); attr('v' + i, 'style', on > .5 ? `filter: drop-shadow(0 0 ${8 + 8 * (t > 53.4 ? Math.sin(t * 3) ** 2 : 0)}px rgba(255,242,204,.9))` : ''); }

    // the voice message plays
    document.querySelectorAll('#sPhone .wv').forEach(w => { const i = +w.dataset.i, h = 10 + Math.abs(Math.sin(t * 7 + i * .9)) * 60 * (t > 54.3 ? 1 : 0); w.setAttribute('height', h); w.setAttribute('y', -5 - h / 2); });

    // bread and medicine fade out (59-62); the closed mushaf glows (62.5-)
    attr('kBread', 'opacity', 1 - ease((t - 59.2) / 1.2)); attr('kMed', 'opacity', 1 - ease((t - 60.4) / 1.2));
    attr('kBook', 'opacity', ease((t - 62.4) / 1.2)); attr('kGlow', 'opacity', ease((t - 62.4) / 1.5) * (.85 + .15 * Math.sin(t * 2)));
    KIT.zoom('sKeep', 1 + clamp(t - 58, 0, 12) * .006);

    // the end: close on the embrace and the whisper, then pull back to the mountain; the closing words appear
    for (let k = 0; k < 3; k++) { const ph = ((t - 72.6) * .7 + k / 3) % 1; attr('wh' + k, 'opacity', t > 72.6 && t < 76.8 ? .8 * (1 - ph) : 0); attr('wh' + k, 'transform', `translate(${-ph * 40} ${-ph * 10})`); }
    const out = ease((t - 76.6) / 3.5), sc = lerp(7.5, 1, out);
    attr('endCam', 'transform', `translate(540 ${lerp(720, 1020, out)}) scale(${sc}) translate(-540 ${-lerp(962, 1020, out)})`);
    attr('endText', 'opacity', ease((t - 78.6) / 1.2));
  },
});
</script>
