<script>
// Narration: verbatim from the series document, EP6 (Hook / script / cliffhanger).
// One caption per line: align.py reads this list.
// His face is drawn (at the user's request) as a flat cartoon, using only features stated in authentic hadith:
//   young man, large body, reddish complexion, very curly hair (al-Bukhari 3441 / 7128, Muslim 169 / 171 / 2937);
//   right eye blind and bulging like a floating grape (al-Bukhari 3439, Muslim 169);
//   ك ف ر between his eyes (al-Bukhari 7131, Muslim 2933).
// Nothing else about him (beard, clothing colour, expression beyond the script's half-smile) comes from a source.
const CAPS = [
  [0, 5.6, '', 'ลูกสาวผมยังอ่านหนังสือไม่ออก…<br>แต่วันนั้น เธออ่านคำบนหน้าผากของเขาได้'],
  [9.6, 14, '', 'เขาเงยหน้าขึ้นมา<br>และผมได้เห็นใบหน้านั้นเต็มตา'],
  [14, 19.5, '', 'ตาข้างขวาของเขาบอดและนูนออกมา<br>เหมือนเมล็ดองุ่นที่ลอยอยู่'],
  [19.5, 23, '', 'ทุกอย่างตรงกับที่ผมเคยได้ยินมาตั้งแต่เด็ก'],
  [23, 29, '', 'และระหว่างดวงตาทั้งสอง มีอักษรสามตัว<br>ชัดเจนราวกับถูกสลักไว้…<br>กาฟ ฟาอ์ รออ์'],
  [29, 32.5, 'big', 'กาฟิร'],
  [32.5, 36.5, '', 'ผู้คนข้างล่างยังโห่ร้องสรรเสริญเขา<br>ราวกับไม่มีใครเห็นอะไรเลย'],
  [36.5, 41, '', 'แล้วเสียงเล็ก ๆ ก็ดังขึ้นข้างหลังผม<br>ฮาวาปีนบันไดตามขึ้นมาตอนไหนไม่รู้'],
  [41, 45, 'q', '“บาบา…<br>หน้าผากเขาเขียนว่า กาฟิร”'],
  [45, 49.5, '', 'ผมหันไปมองลูก<br>ฮาวายังอ่านหนังสือไม่ออกแม้แต่คำเดียว'],
  [49.5, 55, '', 'ผมดึงลูกเข้ามากอด แล้วนึกถึงคำสอนที่ว่า<br>พระผู้อภิบาลของเราไม่ได้ตาบอด'],
  [55, 59.5, '', 'ความกลัวในใจผมเปลี่ยนเป็นความมั่นใจ<br>ผมรู้แล้วว่าตัวเองกำลังมองใครอยู่'],
  [59.5, 63.5, '', 'ชายคนนั้นยิ้มมุมปาก<br>แล้วหันหลังเดินต่อไปพร้อมขบวน'],
  [63.5, 69, '', 'ตกดึก มีเสียงทุบประตูดังสนั่น<br>ทหารของเขาเดินไล่เคาะทีละบ้าน<br>พร้อมรายชื่อของคนที่ไม่ยอมออกไปต้อนรับ'],
  [69, 72.5, '', 'ผมแง้มหน้าต่างดู<br>และหัวใจผมแทบหยุดเต้น'],
  [72.5, 76, '', 'คนที่ยืนถือรายชื่ออยู่หน้าบ้านผม…<br>คือฮาริส'],
  [76, 80.5, 'big', 'ฮาริสพาพวกเขามาจับผมจริง ๆ หรือ?'],
  [80.5, 85, 'big', 'แล้วคนที่ไม่ยอมรับเขา<br>จะถูกพาไปที่ไหน?'],
];
const TAGS = [
  [14, 19.5, 'เศาะฮีห์อัลบุคอรี 3439 · เศาะฮีห์มุสลิม 169'],
  [23, 32.5, 'เศาะฮีห์อัลบุคอรี 7131 · เศาะฮีห์มุสลิม 2933'],
  [45, 49.5, 'ผู้ศรัทธาอ่านได้ ทั้งผู้ที่อ่านออกและอ่านไม่ออก · เศาะฮีห์มุสลิม 2934'],
  [49.5, 55, 'เศาะฮีห์อัลบุคอรี 7131 · เศาะฮีห์มุสลิม 2933'],
];

const RUDDY = '#c97c5f';
const CROWD = ['#7d6a8a', '#5f7d6a', '#8a6a52', '#6a7a8f', '#9a7f5a', '#5a5f72'];

// tight curls: a ring of small circles with a curl stroke in each
const curls = (cx, cy, rx, ry, a0, a1, n, r) => Array.from({ length: n }, (_, i) => {
  const a = a0 + (a1 - a0) * i / (n - 1), x = cx + Math.cos(a) * rx, y = cy + Math.sin(a) * ry;
  return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${HAIR}"/><path d="M${(x - r * .4).toFixed(1)} ${y.toFixed(1)} a${r * .4} ${r * .4} 0 1 1 ${r * .5} ${r * .3}" stroke="#4a3222" stroke-width="4" fill="none"/>`;
}).join('');

// his face, flat cartoon. Origin at the centre of the face (face 400 x 500).
const dajjal = p => `
  <g id="${p}">
    <path d="M-470 640 C-450 400 -300 300 -130 270 L130 270 C300 300 450 400 470 640Z" fill="#3a3430"/>
    <path d="M-130 270 L0 360 L130 270" stroke="#2a2522" stroke-width="10" fill="none"/>
    <rect x="-72" y="170" width="144" height="120" fill="${RUDDY}"/>
    <ellipse cx="-200" cy="10" rx="32" ry="54" fill="${RUDDY}"/><ellipse cx="200" cy="10" rx="32" ry="54" fill="${RUDDY}"/>
    <ellipse cx="0" cy="0" rx="200" ry="250" fill="${RUDDY}"/>
    <path d="M-214 -40 C-236 -300 236 -300 214 -40 C200 -150 120 -190 0 -190 C-120 -190 -200 -150 -214 -40Z" fill="${HAIR}"/>
    ${curls(0, -60, 220, 210, Math.PI * 1.04, Math.PI * 1.96, 17, 34)}
    ${curls(0, -80, 170, 170, Math.PI * 1.12, Math.PI * 1.88, 11, 30)}
    ${curls(0, -100, 90, 120, Math.PI * 1.2, Math.PI * 1.8, 6, 30)}
    <g id="${p}Kfr" font-family="Amiri" font-weight="700" font-size="62" fill="#5a2418" text-anchor="middle">
      <text id="${p}K1" x="64" y="-112">ك</text><text id="${p}K2" x="0" y="-112">ف</text><text id="${p}K3" x="-64" y="-112">ر</text></g>
    <path d="M-150 -62 Q-90 -84 -34 -66 M34 -66 Q90 -84 150 -62" stroke="${HAIR}" stroke-width="14" fill="none" stroke-linecap="round"/>
    <g id="${p}Grape"><ellipse cx="-88" cy="-6" rx="58" ry="40" fill="#000" opacity=".12"/>
      <ellipse cx="-90" cy="-14" rx="52" ry="42" fill="#d8dcc2" stroke="#a49a80" stroke-width="5"/>
      <ellipse cx="-104" cy="-30" rx="14" ry="9" fill="#fff" opacity=".7"/></g>
    <path d="M38 -12 Q90 -46 142 -12 Q90 18 38 -12Z" fill="#f3ece0"/>
    <circle id="${p}Iris" cx="90" cy="-14" r="17" fill="#3a2a20"/><circle cx="96" cy="-20" r="5" fill="#fff" opacity=".8"/>
    <path d="M0 0 C-6 40 -24 70 -10 82 L12 82" stroke="#9a5a44" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path id="${p}Mouth" d="M-64 150 Q0 160 64 150" stroke="#6a2e22" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>`;
// top of his head seen from above: a crown of tight curls on broad shoulders
const crown = (p, s = 1) => `<g id="${p}" transform="scale(${s})"><ellipse cx="0" cy="40" rx="170" ry="70" fill="#000" opacity=".2"/>
  <ellipse rx="150" ry="90" fill="#3a3430"/><circle r="70" fill="${HAIR}"/>${curls(0, 0, 60, 60, 0, Math.PI * 2 * .94, 14, 18)}${curls(0, 0, 28, 28, 0, Math.PI * 2 * .86, 6, 16)}</g>`;
const topPerson = (c, arms) => `<ellipse rx="18" ry="12" fill="${c}"/>${arms ? `<path class="arms" d="M-14 -4 l-10 -26 M14 -4 l10 -26" stroke="${c}" stroke-width="7" stroke-linecap="round"/>` : ''}<circle r="9" fill="#2a1a12"/>`;
const crowdField = (cls, n, sd, arms) => { seed = sd; let s = ''; for (let i = 0; i < n; i++) s += `<g class="${cls}" data-x="${rnd() * 1080}" data-y="${rnd() * 1100}" data-o="${rnd() * 6.28}">${topPerson(CROWD[i % 6], arms)}</g>`; return s; };
const placeCrowd = (cls, t, bob, drift = 0) => document.querySelectorAll('.' + cls).forEach(g => {
  const o = +g.dataset.o, y = (+g.dataset.y - drift * (t + o) + 4400) % 1100;
  g.setAttribute('transform', `translate(${+g.dataset.x + Math.sin(t * 2 + o) * 3} ${y - Math.abs(Math.sin(t * 6 + o)) * bob})`);
});
const SKY = `<linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e2cf"/><stop offset="1" stop-color="#f6dca6"/></linearGradient>`;
const roofFloor = `<rect y="0" width="1080" height="1920" fill="url(#sk)"/>
  <g fill="#9a8a74" opacity=".7">${[[40, 520, 180, 260], [260, 470, 140, 320], [760, 500, 200, 280], [900, 450, 160, 340]].map(([x, y, w, h]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}"/>`).join('')}</g>
  <rect y="760" width="1080" height="1160" fill="#a48c6c"/><rect y="700" width="1080" height="70" fill="#b29a78"/><rect y="690" width="1080" height="14" fill="#c4ac88"/>`;
// a soldier seen at night: dark figure, helmet, a torch held forward
const soldier = (id, x, y, s = 1) => `<g id="${id}" transform="translate(${x} ${y}) scale(${s})"><path d="M-60 0 C-66 -150 -50 -250 -30 -280 L30 -280 C50 -250 66 -150 60 0Z" fill="#0d0f14"/>
  <ellipse cy="-318" rx="40" ry="44" fill="#0d0f14"/><path d="M-46 -330 C-44 -380 44 -380 46 -330Z" fill="#161a22"/><rect x="40" y="-210" width="70" height="22" rx="10" fill="#0d0f14"/></g>`;

function build() {
  // ---- hook: Hawa's small hand holding her father's shirt hem ----
  KIT.S('sHook', `<defs>${SKY}</defs>${roofFloor}
    <g transform="translate(0 -400)">
    <path d="M140 -40 C120 400 110 900 150 1200 L940 1200 C980 900 960 400 940 -40Z" fill="#cdbb9a"/>
    <path d="M150 1150 L940 1150" stroke="#b8a685" stroke-width="10"/>
    <path d="M520 -40 C516 300 510 700 520 1150" stroke="#bba985" stroke-width="6" fill="none" opacity=".6"/>
    <g id="hemPull"><path d="M560 1090 C600 1160 640 1200 650 1260 L740 1250 C720 1190 690 1140 650 1080Z" fill="#c4b190"/></g>
    <g id="tinyHand"><path d="M760 1900 C740 1600 700 1420 680 1300" stroke="#a8583f" stroke-width="80" fill="none" stroke-linecap="round"/>
      <ellipse cx="672" cy="1262" rx="44" ry="40" fill="${SKIN}"/>
      ${[0, 1, 2, 3].map(k => `<rect x="${636 + k * 20}" y="${1220 + Math.abs(k - 1.5) * 6}" width="18" height="44" rx="9" fill="${SKIN}" stroke="#a87a5e" stroke-width="2"/>`).join('')}</g></g>`);

  // ---- the face, looking up from the alley below ----
  KIT.S('sFace', `<rect width="1080" height="1920" fill="#b8a07a"/>
    <rect x="0" y="0" width="230" height="1920" fill="#9a8a74"/><rect x="850" y="0" width="230" height="1920" fill="#9a8a74"/>
    ${crowdField('fc', 46, 61, false)}
    <g id="faceCam"><g id="crownWrap">${crown('dCrown', 2.2)}</g><g id="faceWrap">${dajjal('dj')}</g></g>
    <rect id="eyeDim" width="1080" height="1920" fill="#000" opacity="0"/>`);

  // ---- ك ف ر as a glowing graphic, centre screen ----
  KIT.S('sKfr', `<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <radialGradient id="kg"><stop offset="0" stop-color="#f2c14e" stop-opacity=".25"/><stop offset="1" stop-color="#f2c14e" stop-opacity="0"/></radialGradient></defs>
    <rect width="1080" height="1920" fill="#0b0a0d"/><circle cx="540" cy="620" r="520" fill="url(#kg)"/>
    <g font-family="Amiri" font-weight="700" font-size="260" fill="#f2c14e" text-anchor="middle" filter="url(#glow)">
      <text id="g1" x="800" y="710">ك</text><text id="g2" x="540" y="710">ف</text><text id="g3" x="280" y="710">ر</text></g>`);

  // ---- the crowd below, cheering, as if no one sees anything ----
  KIT.S('sCrowd', `<rect width="1080" height="1920" fill="#b8a07a"/>
    <rect x="0" y="0" width="200" height="1920" fill="#9a8a74"/><rect x="880" y="0" width="200" height="1920" fill="#9a8a74"/>
    ${crowdField('cc', 120, 71, true)}
    <g transform="translate(540 560)">${crown('dCrown2', .55)}</g>`);

  // ---- Hawa comes up the ladder behind him ----
  KIT.S('sLadder', `<defs>${SKY}<clipPath id="hatch"><rect x="0" y="0" width="1080" height="1060"/></clipPath></defs>${roofFloor}
    <path d="M520 1060 L860 1060 L900 1160 L480 1160Z" fill="#3a2a1c"/>
    <rect x="600" y="820" width="16" height="250" fill="#6e4f33"/><rect x="764" y="820" width="16" height="250" fill="#6e4f33"/>
    ${[860, 920, 980, 1040].map(y => `<rect x="600" y="${y}" width="180" height="12" fill="#6e4f33"/>`).join('')}
    <g clip-path="url(#hatch)"><g id="hClimb">${KIT.hawa('h1')}</g></g>
    <path d="M500 1060 L880 1060" stroke="#7a6248" stroke-width="10"/>`);

  // ---- "Baba… it says kafir on his forehead" ----
  KIT.S('sHawa', `<defs>${SKY}</defs>${roofFloor}
    <g transform="translate(560 1120) scale(1.7)">${KIT.hawa('h2')}</g>`);

  // ---- Adam turns to his daughter; she cannot read a single word ----
  KIT.S('sLook', `<defs>${SKY}</defs>${roofFloor}
    <g transform="translate(330 1130) scale(1.25)">${KIT.adamKneel('ak1')}</g>
    <g transform="translate(720 1130) scale(1.4)">${KIT.hawa('h3')}</g>`);

  // ---- he pulls her close; behind them the crowd keeps cheering ----
  seed = 83;
  let far = '';
  for (let i = 0; i < 40; i++) { const x = rnd() * 1120 - 20; far += `<g class="fa" data-o="${rnd() * 6.28}" transform="translate(${x} ${700 + rnd() * 30})"><rect x="-14" y="-40" width="28" height="40" rx="10" fill="#6a5a4a"/><circle cy="-50" r="12" fill="#5a4a3a"/><path class="farm" d="M10 -36 l10 -40" stroke="#6a5a4a" stroke-width="7" stroke-linecap="round"/></g>`; }
  KIT.S('sHug', `<defs>${SKY}<radialGradient id="hw" cx="50%" cy="50%"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".55"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient></defs>
    <rect width="1080" height="1920" fill="url(#sk)"/>
    <g fill="#9a8a74" opacity=".6">${[[20, 420, 200, 300], [700, 380, 180, 340], [880, 440, 220, 280]].map(([x, y, w, h]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}"/>`).join('')}</g>
    <g id="farCrowd" opacity=".75">${far}</g>
    <rect y="760" width="1080" height="1160" fill="#a48c6c"/><rect y="700" width="1080" height="70" fill="#b29a78"/><rect y="690" width="1080" height="14" fill="#c4ac88"/>
    <circle id="hugGlow" cx="540" cy="800" r="560" fill="url(#hw)" opacity="0"/>
    <g transform="translate(560 1160) scale(1.35)">
      <g transform="translate(150 0)">${KIT.hawa('h4')}</g>
      ${KIT.adamKneel('ak2')}
      <path d="M-30 -330 C40 -320 110 -280 170 -230" stroke="#cdbb9a" stroke-width="34" fill="none" stroke-linecap="round"/><circle cx="174" cy="-226" r="17" fill="${SKIN}"/>
    </g>`);

  // ---- he walks on with the procession (from above) ----
  KIT.S('sAway', `<rect width="1080" height="1920" fill="#b8a07a"/>
    <rect x="0" y="0" width="230" height="1920" fill="#9a8a74"/><rect x="850" y="0" width="230" height="1920" fill="#9a8a74"/>
    ${crowdField('ac', 70, 91, false)}
    <g id="awayMan">${crown('dCrown3', .6)}</g>`);

  // ---- night: soldiers going door to door with their torches ----
  seed = 101;
  let houses = '';
  [[-40, 300], [270, 340], [620, 280], [910, 320]].forEach(([x, w], i) => {
    houses += `<rect x="${x}" y="${420 + (i % 2) * 40}" width="${w}" height="700" fill="${i === 1 ? '#262a36' : '#1e222c'}"/>
      <rect id="${i === 1 ? 'door' : 'door' + i}" x="${x + w / 2 - 60}" y="900" width="120" height="220" fill="#3a2e24"/>
      <rect x="${x + 30}" y="${560 + (i % 2) * 40}" width="80" height="90" fill="#141720"/>`;
  });
  KIT.S('sNight', `<defs><linearGradient id="nt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0e18"/><stop offset="1" stop-color="#1c2236"/></linearGradient>
      <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff6d8" stop-opacity=".55"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></linearGradient></defs>
    <rect width="1080" height="1920" fill="url(#nt)"/>
    ${Array.from({ length: 30 }, () => `<circle cx="${rnd() * 1080}" cy="${rnd() * 380}" r="${1 + rnd() * 2}" fill="#dfe6f2" opacity="${.3 + rnd() * .5}"/>`).join('')}
    ${houses}<rect y="1120" width="1080" height="800" fill="#141720"/>
    <polygon id="beamA" points="0,-20 900,-160 900,160 0,20" fill="url(#beam)"/>
    <polygon id="beamB" points="0,-20 900,-160 900,160 0,20" fill="url(#beam)"/>
    ${soldier('sol1', 0, 0, .9)}${soldier('sol2', 0, 0, .8)}`);

  // ---- inside: Adam opens the shutter a crack ----
  KIT.S('sShutter', `<defs><linearGradient id="slit" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c8d4f0" stop-opacity=".0"/><stop offset=".5" stop-color="#e8eefa" stop-opacity=".9"/><stop offset="1" stop-color="#c8d4f0" stop-opacity="0"/></linearGradient></defs>
    <rect width="1080" height="1920" fill="#0e0c0b"/>
    <rect x="240" y="260" width="600" height="760" fill="#2a1f17"/>
    <rect id="slitLight" x="530" y="270" width="20" height="740" fill="url(#slit)"/>
    <g id="shutL"><rect x="250" y="270" width="290" height="740" fill="#4a3626"/>${[0, 1, 2, 3, 4, 5, 6, 7].map(k => `<rect x="270" y="${300 + k * 88}" width="250" height="14" fill="#3a2a1c"/>`).join('')}</g>
    <g id="shutR"><rect x="540" y="270" width="290" height="740" fill="#4a3626"/>${[0, 1, 2, 3, 4, 5, 6, 7].map(k => `<rect x="560" y="${300 + k * 88}" width="250" height="14" fill="#3a2a1c"/>`).join('')}</g>
    <g id="peekHand"><path d="M1200 1300 C1000 1200 800 1050 700 900" stroke="#cdbb9a" stroke-width="90" fill="none" stroke-linecap="round"/><circle cx="696" cy="890" r="44" fill="${SKIN}"/></g>`);

  // ---- through the crack: Harith holding the list, torches sweeping toward the window ----
  KIT.S('sWin', `<defs><linearGradient id="nt2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0e18"/><stop offset="1" stop-color="#232a40"/></linearGradient>
      <radialGradient id="torch"><stop offset="0" stop-color="#fff8e0" stop-opacity=".95"/><stop offset="1" stop-color="#fff8e0" stop-opacity="0"/></radialGradient>
      <clipPath id="crack"><rect x="300" y="0" width="480" height="1920"/></clipPath></defs>
    <rect width="1080" height="1920" fill="#0e0c0b"/>
    <g clip-path="url(#crack)">
      <rect width="1080" height="1920" fill="url(#nt2)"/><rect y="1050" width="1080" height="870" fill="#141720"/>
      ${soldier('sol3', 360, 1060, .75)}${soldier('sol4', 760, 1080, .7)}
      <g transform="translate(560 1110) scale(.95)">${KIT.harith('wh')}
        <g id="list"><rect x="70" y="-330" width="110" height="140" rx="6" fill="#e8e2d2" transform="rotate(-8 125 -260)"/>${[0, 1, 2, 3, 4].map(k => `<rect x="86" y="${-310 + k * 22}" width="${70 - (k % 2) * 20}" height="7" fill="#9a9284" transform="rotate(-8 125 -260)"/>`).join('')}</g></g>
      <circle id="torchSpot" cx="0" cy="700" r="260" fill="url(#torch)" opacity="0"/>
    </g>
    <rect x="240" y="0" width="64" height="1920" fill="#4a3626"/><rect x="776" y="0" width="64" height="1920" fill="#4a3626"/>
    <rect id="flash" width="1080" height="1920" fill="#fff8e6" opacity="0"/>`);
}

KIT.episode({

    attr('sol2', 'transform', `translate(${lerp(1180, 900, ease((t - 64) / 4))} 1190) scale(-.8 .8)`);
