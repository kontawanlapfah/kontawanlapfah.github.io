function build() {
  // ---- 1. split: a flooded green garden | a cracked dry yard ----

    <rect x="534" width="12" height="1920" fill="#20160f"/>`);

  // ---- 2. a street: clouds and rain over some houses only ----
  seed = 8;
  let houses = '', rain = '';
  const wet = [1, 4];
  for (let i = 0, x = 40; i < 6; i++) {
    const w = 150 + rnd() * 20, h = 220 + rnd() * 120;
    houses += `<rect x="${x}" y="${1000 - h}" width="${w}" height="${h}" fill="${wet.includes(i) ? '#8a7a68' : '#c9ad84'}"/><rect x="${x + w * .35}" y="${1000 - 80}" width="${w * .3}" height="80" fill="#5e4a34"/>
      <rect x="${x}" y="1000" width="${w}" height="40" fill="${wet.includes(i) ? '#4f8a44' : '#b89a6c'}"/>`;
    if (wet.includes(i)) {
      rain += `<g class="cloud2" data-x="${x + w / 2}" data-y="${1000 - h - 170}"><ellipse rx="${w * .8}" ry="48" fill="#4a4e58"/><ellipse cx="${-w * .4}" cy="18" rx="${w * .45}" ry="38" fill="#40444e"/><ellipse cx="${w * .42}" cy="14" rx="${w * .5}" ry="42" fill="#454952"/></g>`;
      for (let k = 0; k < 12; k++) rain += `<line class="drop2" data-x="${x + 10 + rnd() * (w - 20)}" data-y0="${1000 - h - 140}" data-y1="${1000 - h}" data-p="${rnd()}" x1="0" y1="0" x2="-4" y2="26" stroke="#9fb3c8" stroke-width="3"/>`;
    }
    x += w + 10;
  }
  KIT.S('sStreet', `<defs>${SKY}</defs><rect width="1080" height="1920" fill="url(#dsk)"/>
    <rect y="1040" width="1080" height="880" fill="#d6bd92"/>${rain}${houses}`);

  // ---- 3. fat goats in one pen | an empty dry pen ----
  const pen = (x, w) => `<g stroke="#7a5a3a" stroke-width="12" stroke-linecap="round">${[0, 1, 2, 3, 4].map(i => `<line x1="${x + i * w / 4}" y1="820" x2="${x + i * w / 4}" y2="1060"/>`).join('')}<line x1="${x}" y1="870" x2="${x + w}" y2="870"/><line x1="${x}" y1="980" x2="${x + w}" y2="980"/></g>`;
  KIT.S('sGoats', `<defs>${SKY}</defs><rect width="1080" height="1920" fill="url(#dsk)"/>

    <rect y="780" width="1080" height="1140" fill="#6fa25a"/>

  KIT.S('sEmpty', `<defs>${SKY}</defs><rect width="1080" height="1920" fill="url(#dsk)"/>

    <rect y="780" width="1080" height="1140" fill="#c9a679"/>

    <g transform="translate(540 1100)" id="dAdam">${KIT.adamBack('db')}</g>
    ${Array.from({ length: 5 }, (_, i) => `<circle class="ring" cx="540" cy="700" r="0" fill="none" stroke="#e9c47e" stroke-width="3"/>`).join('')}`);

  // ---- 7. memory: the shaykh, warm and faded ----
  KIT.S('sMemory', `<rect width="1080" height="1920" fill="#e6d6b8"/>
    ${[0, 1, 2, 3].map(i => `<path d="M${40 + i * 270} 1000 v-460 a110 110 0 0 1 220 0 v460Z" fill="#f7ecd2"/><rect x="${20 + i * 270}" y="420" width="22" height="600" fill="#cdb894"/>`).join('')}
    <rect y="1000" width="1080" height="920" fill="#7a2a26"/>
    <g transform="translate(540 1085)">${KIT.sheikhBack('ms')}</g>
    <rect width="1080" height="1920" fill="#e9c47e" opacity=".22"/>`);
  $('sMemory').querySelector('svg').style.filter = 'sepia(.55) blur(.6px)';

  // ---- 8. prayer before the wall of times ----
  let rows = '';
  PRAYERS.forEach((p, i) => { rows += `<text x="250" y="${430 + i * 110}" font-family="Sans" font-weight="700" font-size="58" fill="#2b2522">${p}</text>
    <g transform="translate(720 ${410 + i * 110})"><circle r="32" fill="none" stroke="#2b2522" stroke-width="6"/><line x1="0" y1="0" x2="0" y2="-22" stroke="#2b2522" stroke-width="6" transform="rotate(${[150, 360, 450, 540, 600][i]})"/><line x1="0" y1="0" x2="0" y2="-14" stroke="#2b2522" stroke-width="7" transform="rotate(${[150, 360, 450, 540, 600][i] / 12})"/></g>`; });
  KIT.S('sPray', `<rect width="1080" height="1920" fill="#d8ccb6"/>${rows}
    <rect y="1060" width="1080" height="860" fill="#6b4a32"/><rect x="330" y="1000" width="420" height="150" rx="10" fill="#6b2a2a"/>
    <g id="pStand" transform="translate(540 1130) scale(.95)">${adamPray}</g>
    <g id="pSit" transform="translate(540 1120) scale(.95)" opacity="0">${KIT.adamBack('ps')}</g>`);

  // ---- 9. Harith at the door again, with a box of fever medicine ----
  KIT.S('sDoor', `<defs><linearGradient id="dn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2236"/><stop offset="1" stop-color="#2c3448"/></linearGradient></defs>

      <linearGradient id="gl2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff6d8" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>

    <rect width="1080" height="1920" fill="#0e0c10"/><rect width="1080" height="1920" fill="url(#bl)"/>
    <g id="boxG">
      <path d="M-40 860 C120 800 260 800 330 820 L330 930 C260 950 120 960 -40 1000Z" fill="#1c1f27"/>
      <path d="M1120 860 C960 800 820 800 750 820 L750 930 C820 950 960 960 1120 1000Z" fill="#1c1f27"/>
      <rect x="300" y="560" width="480" height="300" rx="14" fill="#efe8da"/>
      <rect x="300" y="560" width="480" height="70" rx="14" fill="#d9d0bf"/>
      <rect x="350" y="680" width="70" height="140" fill="#c0392b"/><rect x="315" y="715" width="140" height="70" fill="#c0392b"/>
      <rect x="500" y="690" width="230" height="16" rx="8" fill="#b8ae9c"/><rect x="500" y="730" width="180" height="16" rx="8" fill="#b8ae9c"/><rect x="500" y="770" width="210" height="16" rx="8" fill="#b8ae9c"/>
      <g clip-path="url(#boxC)"><rect id="glint" x="0" y="540" width="120" height="340" fill="url(#gl2)" transform="skewX(-20)"/></g>
      <path d="M330 820 C300 780 290 720 320 690 C350 670 360 720 350 760Z M750 820 C780 780 790 720 760 690 C730 670 720 720 730 760Z" fill="#8a6a58"/>
      <path d="M330 820 C300 780 290 720 320 690 M750 820 C780 780 790 720 760 690" stroke="#7ea3c8" stroke-width="4" fill="none" opacity=".6"/>
    </g>`);
}

KIT.episode({
  num: 4, name: 'ฝนที่เลือกบ้าน',
  total: 100.3, title: [5.6, 9.6], ctaWin: [83.3, 89.3], discWin: [89.3, 95.8], outroAt: 95.8,
  cta: '“ถ้าคุณเป็นอาดัม<br><b>คุณจะรับยากล่องนั้นไหม?</b><br>คอมเมนต์บอกกันด้วย<br>แล้วกดติดตามและแชร์ไว้<br>พรุ่งนี้ทั้งเมืองจะเปลี่ยนไป”',
  refs: 'หลักฐานหลัก: เศาะฮีห์มุสลิม 2937',
  scenes: [
    ['sSplit', 0, 9.8], ['sStreet', 9.6, 18.2], ['sGoats', 18, 23.5, { hardOut: true }], ['sEmpty', 23.5, 28.2, { cut: true }],
    ['sWatch', 28, 35.2], ['sCloth', 35, 42.2], ['sDoubt', 42, 47.2], ['sMemory', 47, 53.2], ['sPray', 53, 58.2],
    ['sDoor', 58, 73.7], ['sBox', 73.5, 83, { hardOut: true }], ['sDoor', 95.4, 101],
  ],
  caps: CAPS, tags: TAGS,
  keys: [[1.5, 1], [7.5, 2], [11, 3], [15, 4], [21, 5], [26, 6], [30, 7], [33, 8], [37, 9], [40.5, 10], [45, 11], [50, 12], [56, 13], [61, 14], [65, 15], [69, 16], [72.5, 17], [76, 18], [81, 19], [86, 20], [92.5, 21], [98, 22]],
  build,
  draw(t) {
    // 1. rain falls on the green side only; puddles shimmer
    document.querySelectorAll('#sSplit .rl').forEach(l => { const p = (t * 1.3 + +l.dataset.p) % 1; l.setAttribute('transform', `translate(${l.dataset.x} ${-40 + p * 820})`); });
    document.querySelectorAll('#sSplit .pud').forEach((e, i) => e.setAttribute('opacity', .8 + .2 * Math.sin(t * 3 + i)));
    KIT.zoom('sSplit', 1 + Math.min(t, 10) * .008);

    // 2. clouds settle over two houses; rain falls only there
    const come = ease((t - 9.8) / 2);
    document.querySelectorAll('#sStreet .cloud2').forEach((c, i) => { c.setAttribute('transform', `translate(${+c.dataset.x + (1 - come) * (i ? 300 : -300)} ${c.dataset.y})`); c.setAttribute('opacity', come); });
    document.querySelectorAll('#sStreet .drop2').forEach(d => { const p = (t * 1.4 + +d.dataset.p) % 1; d.setAttribute('transform', `translate(${d.dataset.x} ${lerp(+d.dataset.y0, +d.dataset.y1, p)})`); d.setAttribute('opacity', .8 * ease((t - 11) / 1)); });
    KIT.zoom('sStreet', 1 + clamp(t - 9.6, 0, 9) * .008);

    // 3. goats graze (heads bob) | an empty pen, a bit of dry brush rolling
    document.querySelectorAll('#goatsG > g').forEach((g, i) => { const b = g.getAttribute('transform').replace(/ rotate\([^)]*\)/, ''); g.setAttribute('transform', b + ` rotate(${Math.sin(t * 2 + i * 2) * 2})`); });
    attr('tumble', 'transform', `translate(${lerp(-60, 1140, clamp((t - 23.5) / 4.5))} 1150) rotate(${t * 200})`);

    // 4. the watch races through the long day
    const hrs = t < 28 ? 9 : 9 + (t - 28) * 6;
    KIT.setWatch('w4', hrs, hrs * 3600);
    attr('w4s', 'opacity', .25);

    // 5. the cloth is wrung: two drops, then the bottle less than half full
    const wr = Math.sin(clamp((t - 35.4) / 2.4) * Math.PI * 3);
    attr('clothG', 'transform', `translate(540 760) scale(${1 - .03 * Math.abs(wr)} 1) rotate(${wr * 2}) translate(-540 -760)`);
    document.querySelectorAll('#sCloth .dr').forEach(d => { const p = clamp((t - 36.2 - d.dataset.i * .9) / .7); d.setAttribute('cy', 840 + p * 360); d.setAttribute('opacity', p > 0 && p < 1 ? 1 : 0); });
    const bt = ease((t - 38.6) / .6);
    attr('bottle', 'opacity', bt); attr('clothG', 'opacity', 1 - bt);
    const lvl = lerp(700, 760, ease((t - 39.2) / 1.5));
    attr('water', 'y', lvl); attr('water', 'height', 882 - lvl);

    // 6. doubt: the lamp wavers, rings close in
    attr('dLamp', 'opacity', .1 + .05 * Math.sin(t * 9));
    document.querySelectorAll('#sDoubt .ring').forEach((r, i) => { const p = ((t - 42) * .35 + i / 5) % 1; r.setAttribute('r', 600 * (1 - p)); r.setAttribute('opacity', t > 42 ? .25 * p : 0); });
    attr('dAdam', 'transform', `translate(540 ${1100 + Math.sin(t * 1.4) * 3})`);

    // 7. memory: a slow push
    KIT.zoom('sMemory', 1 + clamp(t - 47, 0, 6) * .012);

    // 8. standing in prayer, then sitting before the salam
    const sit = ease((t - 55.6) / .6);
    attr('pStand', 'opacity', 1 - sit); attr('pSit', 'opacity', sit);

    // 9. the door: lamp, Harith's hands shake as he speaks
    KIT.updLantern('dl', t);
    const shake = t > 58.5 ? Math.sin(t * 38) * 3 + Math.sin(t * 23) * 2 : 0;
    attr('dBox', 'transform', `translate(${shake} ${-300 + shake * .6})`);
    attr('dHar', 'transform', `translate(730 ${1090 + Math.sin(t * 1.3) * 2}) scale(.82)`);
    KIT.harithEyes('dh', .2);
    KIT.zoom('sDoor', t < 74 ? 1 + clamp(t - 58, 0, 16) * .005 : 1.08);

    // 10. close-up: trembling box, lamplight sliding across the label
    const sh = Math.sin(t * 41) * 4 + Math.sin(t * 27) * 3;
    attr('boxG', 'transform', `translate(${sh} ${sh * .5}) rotate(${sh * .2} 540 720)`);
    attr('glint', 'x', 200 + 200 * Math.sin((t - 73.5) * .9));
    KIT.zoom('sBox', 1 + clamp(t - 73.5, 0, 10) * .012);
  },
});
</script>
</body>
</html>
